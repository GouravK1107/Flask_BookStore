{% extends "base.html" %}
{% block title %}Login - BookStore{% endblock %}
{% block extra_css %}
<style>
    body {
        background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                    url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?ixlib=rb-4.0.3&auto=format&fit=crop&w=2070&q=80');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
    }
    .auth-container {
        max-width: 450px;
        margin: 60px auto;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(2px);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .auth-container h2 {
        text-align: center;
        margin-bottom: 30px;
        color: #1a1a1a;
        font-size: 1.8rem;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group input {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #e0e0e0;
        border-radius: 10px;
        font-size: 1rem;
        transition: 0.2s;
    }
    .form-group input:focus {
        outline: none;
        border-color: #e67e22;
        box-shadow: 0 0 0 3px rgba(230,126,34,0.1);
    }
    .btn-submit {
        width: 100%;
        background: #e67e22;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }
    .btn-submit:hover {
        background: #d35400;
        transform: translateY(-1px);
    }
    .auth-link {
        text-align: center;
        margin-top: 20px;
        color: #4a5568;
    }
    .auth-link a {
        color: #e67e22;
        text-decoration: none;
        font-weight: 500;
    }
    .auth-link a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}
{% block content %}
<div class="auth-container">
    <h2>Welcome Back</h2>
    <form method="POST">
        <div class="form-group">
            <input type="email" name="email" placeholder="Email address" required autofocus>
        </div>
        <div class="form-group">
            <input type="password" name="password" placeholder="Password" required>
        </div>
        <button type="submit" class="btn-submit">Sign In</button>
    </form>
    <p class="auth-link">Don't have an account? <a href="{{ url_for('register') }}">Create account</a></p>
</div>
{% endblock %}
